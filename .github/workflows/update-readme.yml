name: Refresh profile
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/profile.json
      - scripts/**
      - .github/workflows/update-readme.yml
permissions:
  contents: read
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh public statistics and profile assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate-assets.py --refresh
      - name: Validate profile
        run: python3 scripts/validate.py
      - name: Commit generated assets only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/ data/stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh profile assets'
          git push origin HEAD:main

