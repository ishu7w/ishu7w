    <circle cx="32" cy="110" r="3" />
    <circle cx="32" cy="164" r="3" />
    <circle cx="32" cy="218" r="3" />
  </g>
  <g font-family="Arial, Helvetica, sans-serif" dominant-baseline="middle">
    <g fill="#fff4f8" font-size="23" font-weight="700">
      <text x="52" y="57">JAVA &amp; PROBLEM SOLVING</text>
      <text x="52" y="111">FULL-STACK DEVELOPMENT</text>
