<svg xmlns="http://www.w3.org/2000/svg" width="960" height="40" viewBox="0 0 960 40" role="img" aria-labelledby="title"><title id="title">Sakura section divider</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#fff4f7}.muted{fill:#c5bacb}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.signal{stroke-dasharray:18 480;animation:flow 12s linear infinite}.cursor{animation:cursor 1.6s step-end infinite}@keyframes flow{to{stroke-dashoffset:-996}}@keyframes cursor{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.signal{stroke-dasharray:none}}</style><path d="M0 20 H450 M510 20 H960" stroke="#39303f"/><g transform="translate(480 20) rotate(18) scale(0.6)"><path transform="rotate(0)" d="M0 0 C-11 -5 -13 -18 -5 -23 L0 -19 L5 -23 C13 -18 11 -5 0 0Z" fill="#f3abc6" stroke="#ffd9e6" stroke-width=".6"/><path transform="rotate(72)" d="M0 0 C-11 -5 -13 -18 -5 -23 L0 -19 L5 -23 C13 -18 11 -5 0 0Z" fill="#f3abc6" stroke="#ffd9e6" stroke-width=".6"/><path transform="rotate(144)" d="M0 0 C-11 -5 -13 -18 -5 -23 L0 -19 L5 -23 C13 -18 11 -5 0 0Z" fill="#f3abc6" stroke="#ffd9e6" stroke-width=".6"/><path transform="rotate(216)" d="M0 0 C-11 -5 -13 -18 -5 -23 L0 -19 L5 -23 C13 -18 11 -5 0 0Z" fill="#f3abc6" stroke="#ffd9e6" stroke-width=".6"/><path transform="rotate(288)" d="M0 0 C-11 -5 -13 -18 -5 -23 L0 -19 L5 -23 C13 -18 11 -5 0 0Z" fill="#f3abc6" stroke="#ffd9e6" stroke-width=".6"/><circle r="3" fill="#f9dcad"/><circle r="1.2" fill="#9c5e78"/></g><style>*{animation:none!important}.fallback{opacity:1!important}.role{display:none!important}</style></svg>
