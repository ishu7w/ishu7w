<svg xmlns="http://www.w3.org/2000/svg" width="960" height="24" viewBox="0 0 960 24" role="img" aria-labelledby="title"><title id="title">Section divider</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f1f5ff}.muted{fill:#b2c1d9}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.signal{stroke-dasharray:18 480;animation:flow 12s linear infinite}.cursor{animation:cursor 1.6s step-end infinite}@keyframes flow{to{stroke-dashoffset:-996}}@keyframes cursor{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.signal{stroke-dasharray:none}}</style><path d="M0 12 H960" stroke="#24334e"/><path class="signal" d="M0 12 H960" stroke="#8caeff"/><style>*{animation:none!important}.fallback{opacity:1!important}.role{display:none!important}</style></svg>
